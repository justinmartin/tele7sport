name: 📱 Données de l'app (catalog.json)

on:
  schedule:
    # Toutes les 6 h, à une minute « impaire » : GitHub retarde de plusieurs heures les tâches posées
    # pile sur l'heure (constaté : 5 h UTC partait vers 10 h). Quatre passages gardent l'app fraîche malgré tout.
    - cron: '17 2,8,14,20 * * *'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: favorites.json depuis le secret
        run: |
          if [ -n "$FAVORITES_JSON" ]; then echo "$FAVORITES_JSON" > favorites.json; else cp favorites.example.json favorites.json; fi
        env:
          FAVORITES_JSON: ${{ secrets.FAVORITES_JSON }}

      - name: Générer les données
        env:
          TIMEZONE: ${{ secrets.TIMEZONE }}
          LANGUAGE: ${{ secrets.LANGUAGE }}
        run: python3 run.py export

      - name: Publier si quelque chose a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/catalog.json
          if git diff --cached --quiet; then echo "Rien de neuf"; exit 0; fi
          git commit -m "data: catalogue $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
