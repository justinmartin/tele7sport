<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Télé7Sport">
  <title>Télé7Sport</title>
  <link rel="manifest" href="/programme/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/programme/icon-180.png">
  <link rel="icon" href="/programme/icon-512.png" type="image/png">
  <link rel="stylesheet" href="/programme/app.css">
</head>
<body>
  <header class="top">
    <div class="brand">TÉLÉ<span>7</span>SPORT</div>
    <div class="top-meta">
      <span id="updated">Chargement…</span>
      <button class="icon-btn" id="refresh" type="button" aria-label="Actualiser">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg>
      </button>
    </div>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabs" aria-label="Sections">
    <button class="tab" data-tab="today" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="13" rx="2"/><path d="M8 22h8M12 18v4"/></svg>
      <span>Ce soir</span>
    </button>
    <button class="tab" data-tab="week" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
      <span>Semaine</span>
    </button>
    <button class="tab" data-tab="results" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>
      <span>Résultats</span>
    </button>
    <button class="tab" data-tab="standings" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Classements</span>
    </button>
  </nav>

  <script src="/programme/app.js"></script>
</body>
</html>
