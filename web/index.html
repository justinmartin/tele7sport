<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#141414">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Télé7Sport">
  <title>Télé7Sport</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,125,800;1,125,800;1,125,900&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <!-- Écran de bienvenue : une fois par jour, 2 s, puis le logo grandit vers nous et l'app apparaît.
       Un toucher l'écourte. Pas quand un lien ouvre directement une page. -->
  <div class="splash" id="splash" hidden>
    <div class="splash-logo"><svg viewBox="-110 -2 324 104" aria-hidden="true" class="splash-mark"><g transform="skewX(-14)"><rect x="-66" y="7" width="58" height="11" rx="5.5" fill="#c3a6e6" opacity="1"/><rect x="-42" y="31" width="34" height="11" rx="5.5" fill="#c3a6e6" opacity="0.85"/><rect x="-84" y="55" width="76" height="11" rx="5.5" fill="#c3a6e6" opacity="1"/><rect x="-34" y="79" width="26" height="11" rx="5.5" fill="#c3a6e6" opacity="0.7"/><path fill="#fff" d="M0 0h64v24H44v76H20V24H0z"/><path fill="#c3a6e6" d="M72 0h64v24l-36 76H76l34-76H72z"/><path fill="#fff" d="M152 0h56v24h-40v14h32l8 8v46l-8 8h-56V76h40V62h-32l-8-8V8z"/><rect x="-4" y="44.5" width="122" height="4" fill="#141414"/><rect x="-4" y="68.5" width="76" height="4" fill="#141414"/></g></svg></div>
    <p class="splash-title">Bienvenue<span id="splash-name"></span></p>
  </div>
  <script>
    (function () {
      var el = document.getElementById('splash');
      var get = function (k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
      var d = new Date(), day = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
      if (location.search || get('t7s_splash') === day) return;
      try { localStorage.setItem('t7s_splash', JSON.stringify(day)); } catch (e) {}
      var account = get('t7s_account');
      if (account && account.pseudo) {
        var name = document.createElement('i');
        name.textContent = account.pseudo;
        document.getElementById('splash-name').append(',\u00a0', name);
      }
      el.hidden = false;
      document.documentElement.classList.add('splash-on');
      requestAnimationFrame(function () { el.classList.add('in'); });
      var done = false, timer = setTimeout(close, 1500);
      function close() {
        if (done) return;
        done = true; clearTimeout(timer);
        el.classList.add('out');
        document.documentElement.classList.remove('splash-on');
        setTimeout(function () { el.remove(); }, 650);
      }
      el.addEventListener('click', close);
    })();
  </script>
  <!-- Barre du haut façon ESPN : logo sur un bloc rouge biseauté, puis le bandeau de mes compétitions -->
  <header class="top">
    <div class="topbar">
      <a class="brand" href="/" aria-label="Télé7Sport, accueil">
        <svg viewBox="-110 -2 324 104" aria-hidden="true"><g transform="skewX(-14)"><rect x="-66" y="7" width="58" height="11" rx="5.5" fill="#c3a6e6" opacity="1"/><rect x="-42" y="31" width="34" height="11" rx="5.5" fill="#c3a6e6" opacity="0.85"/><rect x="-84" y="55" width="76" height="11" rx="5.5" fill="#c3a6e6" opacity="1"/><rect x="-34" y="79" width="26" height="11" rx="5.5" fill="#c3a6e6" opacity="0.7"/><path fill="#fff" d="M0 0h64v24H44v76H20V24H0z"/><path fill="#c3a6e6" d="M72 0h64v24l-36 76H76l34-76H72z"/><path fill="#fff" d="M152 0h56v24h-40v14h32l8 8v46l-8 8h-56V76h40V62h-32l-8-8V8z"/><rect x="-4" y="44.5" width="122" height="4" fill="#141414"/><rect x="-4" y="68.5" width="76" height="4" fill="#141414"/></g></svg>
      </a>
      <div class="top-actions">
        <span class="updated" id="updated"></span>
        <button class="icon-btn" id="refresh" type="button" aria-label="Actualiser">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg>
        </button>
        <button class="icon-btn" id="open-favs" type="button" aria-label="Mes favoris">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z"/></svg>
        </button>
        <button class="icon-btn" id="open-me" type="button" aria-label="Mon compte"></button>
      </div>
    </div>
    <nav class="strip" id="strip" aria-label="Mes compétitions"></nav>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabs" aria-label="Sections">
    <button class="tab" data-tab="week" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
      <span>Calendrier</span>
    </button>
    <button class="tab" data-tab="results" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>
      <span>Résultats</span>
    </button>
    <button class="tab tab-main" data-tab="today" type="button">
      <svg class="tab-logo" viewBox="-6 -2 222 104" aria-hidden="true"><g transform="skewX(-14)"><path fill="currentColor" d="M0 0h64v24H44v76H20V24H0z"/><path fill="var(--accent)" d="M72 0h64v24l-36 76H76l34-76H72z"/><path fill="currentColor" d="M152 0h56v24h-40v14h32l8 8v46l-8 8h-56V76h40V62h-32l-8-8V8z"/></g></svg>
      <span>Ce soir</span>
    </button>
    <button class="tab" data-tab="standings" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Classements</span>
    </button>
    <button class="tab" data-tab="news" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 6h3a1 1 0 0 1 1 1v11a2 2 0 0 1-4 0V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v12a3 3 0 0 0 3 3h11M8 8h4M8 12h4M8 16h4"/></svg>
      <span>Actu</span>
    </button>
  </nav>

  <div class="sheet" id="favs" role="dialog" aria-modal="true" aria-labelledby="favs-title" hidden>
    <div class="sheet-head">
      <h2 id="favs-title">Mes favoris</h2>
      <button class="text-btn" id="close-favs" type="button">Terminé</button>
    </div>
    <div class="sheet-body" id="favs-body"></div>
  </div>

  <div class="sheet" id="account" role="dialog" aria-modal="true" aria-labelledby="account-title" hidden>
    <div class="sheet-head">
      <h2 id="account-title">Mon compte</h2>
      <button class="text-btn" id="close-account" type="button">Terminé</button>
    </div>
    <div class="sheet-body" id="account-body"></div>
  </div>

  <div class="sheet" id="team" role="dialog" aria-modal="true" aria-labelledby="team-name" hidden>
    <div class="sheet-head">
      <button class="text-btn back" id="close-team" type="button" aria-label="Fermer la fiche">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Retour
      </button>
      <button class="fav-star" id="team-fav" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z"/></svg>
        <span>Ajouter à mes favoris</span>
      </button>
    </div>
    <div class="sheet-body" id="team-body"></div>
  </div>

  <div class="sheet" id="match" role="dialog" aria-modal="true" aria-labelledby="match-title" hidden>
    <div class="sheet-head">
      <button class="text-btn back" id="close-match" type="button" aria-label="Fermer la fiche">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Retour
      </button>
      <span></span>
    </div>
    <div class="sheet-body" id="match-body"></div>
  </div>

  <div class="action-sheet" id="cal" hidden>
    <div class="as-backdrop" data-close></div>
    <div class="as-panel" role="dialog" aria-modal="true" aria-labelledby="cal-title">
      <div class="as-head"><h3 id="cal-title"></h3><p id="cal-sub"></p></div>
      <div class="as-options" id="cal-options"></div>
      <button class="as-cancel" type="button" data-close>Annuler</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
