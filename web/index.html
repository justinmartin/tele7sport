<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1b1b1b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Télé7Sport">
  <title>Télé7Sport</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <!-- Barre du haut façon ESPN : logo sur un bloc rouge biseauté, puis le bandeau de mes compétitions -->
  <header class="top">
    <div class="topbar">
      <a class="brand" href="/" aria-label="Télé7Sport, accueil">
        <svg viewBox="-22 0 232 100" aria-hidden="true"><g transform="skewX(-12)">
          <path fill="#fff" d="M0 0h64v24H44v76H20V24H0z"/>
          <path fill="#111" d="M72 0h64v24l-36 76H76l34-76H72z"/>
          <path fill="#fff" d="M152 0h56v24h-40v14h32l8 8v46l-8 8h-56V76h40V62h-32l-8-8V8z"/>
        </g></svg>
      </a>
      <div class="top-actions">
        <span class="updated" id="updated"></span>
        <button class="icon-btn" id="refresh" type="button" aria-label="Actualiser">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg>
        </button>
        <button class="icon-btn" id="open-favs" type="button" aria-label="Mes favoris">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z"/></svg>
        </button>
        <button class="icon-btn" id="open-me" type="button" aria-label="Mon compte"></button>
      </div>
    </div>
    <nav class="strip" id="strip" aria-label="Mes compétitions"></nav>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabs" aria-label="Sections">
    <button class="tab" data-tab="today" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="13" rx="2"/><path d="M8 22h8M12 18v4"/></svg>
      <span>Ce soir</span>
    </button>
    <button class="tab" data-tab="week" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
      <span>Calendrier</span>
    </button>
    <button class="tab" data-tab="results" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>
      <span>Résultats</span>
    </button>
    <button class="tab" data-tab="standings" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Classements</span>
    </button>
  </nav>

  <div class="sheet" id="favs" role="dialog" aria-modal="true" aria-labelledby="favs-title" hidden>
    <div class="sheet-head">
      <h2 id="favs-title">Mes favoris</h2>
      <button class="text-btn" id="close-favs" type="button">Terminé</button>
    </div>
    <div class="sheet-body" id="favs-body"></div>
  </div>

  <div class="sheet" id="account" role="dialog" aria-modal="true" aria-labelledby="account-title" hidden>
    <div class="sheet-head">
      <h2 id="account-title">Mon compte</h2>
      <button class="text-btn" id="close-account" type="button">Terminé</button>
    </div>
    <div class="sheet-body" id="account-body"></div>
  </div>

  <div class="sheet" id="team" role="dialog" aria-modal="true" aria-labelledby="team-name" hidden>
    <div class="sheet-head">
      <button class="text-btn back" id="close-team" type="button" aria-label="Fermer la fiche">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Retour
      </button>
      <span></span>
    </div>
    <div class="sheet-body" id="team-body"></div>
  </div>

  <div class="action-sheet" id="cal" hidden>
    <div class="as-backdrop" data-close></div>
    <div class="as-panel" role="dialog" aria-modal="true" aria-labelledby="cal-title">
      <div class="as-head"><h3 id="cal-title"></h3><p id="cal-sub"></p></div>
      <div class="as-options" id="cal-options"></div>
      <button class="as-cancel" type="button" data-close>Annuler</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
